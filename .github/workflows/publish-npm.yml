name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publish only from a version tag, including manual re-runs.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: npm ci
      - name: Check tag matches package version
        run: |
          node -e "const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); const pkg = require('./package.json'); if (pkg.version !== tag) { throw new Error('Tag v' + tag + ' does not match package version ' + pkg.version); }"
      - run: npm run lint
      - run: npm run check
      - name: Package dry run (fail on bin warnings)
        run: |
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.log"
          if grep -Ei 'bin\[|no bin file' "$RUNNER_TEMP/pack.log"; then echo "::error::npm rewrote or dropped the bin entry"; exit 1; fi
      - name: Publish package
        run: npm publish --access public
