name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported runtime (engines), the active LTS, and the newest release line.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Package dry run (fail on bin warnings)
        run: |
          npm pack --dry-run 2>&1 | tee "$RUNNER_TEMP/pack.log"
          if grep -Ei 'bin\[|no bin file' "$RUNNER_TEMP/pack.log"; then echo "::error::npm rewrote or dropped the bin entry"; exit 1; fi
